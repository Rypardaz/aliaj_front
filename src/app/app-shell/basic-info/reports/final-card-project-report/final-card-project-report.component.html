<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header"> شروط گزارش </div>
      <div class="card-body">
        <div class="form-group row" [formGroup]="form">
          <div class="col-4">
            <ng-select formControlName="projectGuid" class="mt-1" placeholder="انتخاب پروژه">
              @for (item of projects; track item) {
              <ng-option [value]="item.guid">{{item.title}}</ng-option>
              }
            </ng-select>
          </div>

          <div class="col-4">
            <ng-select formControlName="partGuid" class="mt-1" placeholder="انتخاب گروه/نوع قطعه">
              @for (item of partTypes; track item) {
              <ng-option [value]="item.guid">{{item.title}}</ng-option>
              }
            </ng-select>
          </div>

          <div class="col-4">
            <ng-select formControlName="partCode" class="mt-1" placeholder="انتخاب کد قطعه">
              @for (item of partCodes; track item) {
              <ng-option [value]="item.title">{{item.title}}</ng-option>
              }
            </ng-select>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header">
        <div class="button-list">
          <app-label-icon-button identifier="submitBtn" label="دریافت گزارش" icon="fas fa-redo-alt"
            (clicked)="getReport()">
          </app-label-icon-button>
          <app-label-icon-button btnType="button" identifier="submitBtn" label="حذف جستجو"
            className="btn btn-outline-danger" icon="fas fa-eye-slash" (clicked)="removeAllFilters()">
          </app-label-icon-button>
          <app-label-icon-button btnType="button" identifier="submitBtn" label="Excel دریافت"
            className="btn btn-outline-secondary" icon="fas fa-file-excel" (click)="onExportExcel()">
          </app-label-icon-button>
        </div>
      </div>

      <div class="card-body">
        <ag-grid-angular #agGrid [style]="agGridStyle" [class]="agGridTheme" [rowData]="records"
          [gridOptions]="gridOptions" (gridReady)="onGridReady($event)">
        </ag-grid-angular>
      </div>

    </div>
  </div>
</div>
