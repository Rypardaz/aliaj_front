<div class="row">
    <div class="col-12">
        <div class="card">

            <div class="card-body">
                <ag-grid-angular #agGrid [style]="agGridStyle" [class]="agGridTheme" [rowData]="records"
                    [gridOptions]="gridOptions" [columnDefs]="gridOptions.columnDefs" (gridReady)="onGridReady($event)">
                </ag-grid-angular>
            </div>

        </div>
    </div>
</div>
